plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.hsn'
version = '0.1.0'

android {
  namespace 'app.hsn.push'
  defaultConfig { versionName '0.1.0' }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // The runtime variant includes the FCM classes already packaged by expo-notifications.
  compileOnly('host.exp.exponent:expo.modules.notifications:58.1.9') {
    attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
  }
  testImplementation localGroovy()
  testImplementation 'junit:junit:4.13.2'
}

// Run the pure JVM rules against fresh output from the protocol's published generator.
def vectors = layout.buildDirectory.file('push-test/vectors.json')
def generate = tasks.register('generatePushVectors', Exec) {
  outputs.upToDateWhen { false }
  workingDir projectDir.parentFile
  commandLine 'bun', 'vectors.ts', vectors.get().asFile.absolutePath
}
tasks.withType(Test).configureEach {
  dependsOn generate
  inputs.file(vectors)
  inputs.files(file('../../../locales/en/common.json'), file('../locales/en/push.json'))
  systemProperty 'push.vectors', vectors.get().asFile.absolutePath
  systemProperty 'push.common', file('../../../locales/en/common.json').absolutePath
  systemProperty 'push.words', file('../locales/en/push.json').absolutePath
  // The repository lints all JavaScript, including Gradle's generated HTML viewer. Keep the XML.
  reports.html.required = false
}
tasks.register('pushJvmTest') { dependsOn 'testDebugUnitTest' }
