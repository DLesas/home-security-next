plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.hsn'
version = '0.1.0'

android {
  namespace 'app.hsn.push'
  defaultConfig { versionName '0.1.0' }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // The runtime variant includes the FCM classes already packaged by expo-notifications.
  compileOnly('host.exp.exponent:expo.modules.notifications:58.1.9') {
    attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
  }
  testCompileOnly localGroovy()
}

// Run the pure JVM rules against fresh output from the protocol's published generator.
def vectors = layout.buildDirectory.file('push-test/vectors.json')
def generate = tasks.register('generatePushVectors', Exec) {
  outputs.upToDateWhen { false }
  workingDir projectDir.parentFile
  commandLine 'bun', 'vectors.ts', vectors.get().asFile.absolutePath
}
def rules = tasks.register('pushJvmTest', JavaExec) {
  dependsOn generate, 'compileDebugUnitTestKotlin'
  mainClass = 'app.hsn.push.PushRulesTestKt'
  classpath files(providers.provider {
    [tasks.named('compileDebugKotlin').get().destinationDirectory.get().asFile,
     tasks.named('compileDebugUnitTestKotlin').get().destinationDirectory.get().asFile]
  }), files(fileTree(new File(gradle.gradleHomeDir, 'lib')) { include 'kotlin-stdlib-*.jar', 'groovy-*.jar' })
  args vectors.get().asFile.absolutePath
}
tasks.matching { it.name == 'testDebugUnitTest' }.configureEach { dependsOn rules }
